# Pledge check: the 22nd election district pledges (NEC open API) and where each
# stands, judged from news and web search. Run by hand; scope 'pilot' checks ten
# members, 'all' every district member. Results are committed to main under
# app/data/source (they show on the site only once the page uses them).
name: pledges

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "pilot, all, or comma-separated member codes"
        default: pilot

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 340  # a full run checks ~240 members at about a minute each
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/pipeline/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: pip install -r app/pipeline/requirements.txt
      - name: Pledges (election commission winners, campaign news)
        timeout-minutes: 60
        continue-on-error: true
        working-directory: app/pipeline
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLEDGE_MODEL: claude-haiku-5-5
          PLEDGE_SCOPE: ${{ inputs.scope }}
        run: python -u pledges.py
      - name: Where each pledge stands
        # stops before the job limit so what was checked is still saved; a rerun continues
        # (members checked in the last 25 days are skipped)
        timeout-minutes: 240
        continue-on-error: true
        working-directory: app/pipeline
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLEDGE_MODEL: claude-haiku-5-5
          PLEDGE_SCOPE: ${{ inputs.scope }}
        run: python -u pledge_check.py
      - name: Save
        if: always()
        run: |
          git config user.name 'data-update-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for f in app/data/source/pledges.json app/data/source/pledge-status.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then echo 'no changes'; exit 0; fi
          git commit -q -m "data: pledges (${{ inputs.scope }})"
          git pull -q --rebase origin main
          git push origin HEAD:main
      - name: Rebuild the site data
        id: build
        if: always()
        continue-on-error: true
        working-directory: app/pipeline
        run: |
          python -u build.py
          python -u check.py
      - name: Publish
        if: steps.build.outcome == 'success'
        run: |
          git add app/data app/lib app/public/bills app/public/pledge-data.json app/public/vote-data app/public/weekly.json app/public/og app/public/law-data app/public/quiz-data.json app/public/audit.json app/public/audit-data app/public/party-data.json app/public/poll-data.json
          git add -u app/public
          if git diff --cached --quiet; then echo 'no changes'; exit 0; fi
          git commit -q -m "data: pledge pages"
          git pull -q --rebase origin main
          git push origin HEAD:main
