name = "assembly-dashboard"
compatibility_date = "2026-09-01"
pages_build_output_dir = "public"

# Data is bundled with the code (lib/member-records.js, lib/score-run.js),
# generated by pipeline/build.py. The D1 database used up to 2026-10-09 is
# no longer bound; migrations/ is kept as history.

# Visitor poll answers (/api/poll). Tables are created on first use.
[[d1_databases]]
binding = "DB"
database_name = "assembly-polls"
database_id = "972245c6-7f30-4e32-897d-60f9e9064f00"
