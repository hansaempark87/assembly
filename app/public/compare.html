<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>의원 비교 — 일하는 국회</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .picker-row { display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
  .picker-box { flex:1; min-width:220px; }
  .picker-box input { width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; }
  .picker-box .suggest { position:relative; }
  .picker-box .suggest-list { position:absolute; z-index:5; background:#fff; border:1px solid var(--border); border-radius:6px; width:100%; max-height:220px; overflow-y:auto; display:none; }
  .picker-box .suggest-list div { padding:8px 10px; cursor:pointer; font-size:0.85rem; }
  .picker-box .suggest-list div:hover { background:#f0f3f6; }
  .compare-table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .compare-table th, .compare-table td { padding:10px 12px; border-bottom:1px solid var(--border); font-size:0.9rem; }
  .compare-table th { background:#f0f3f6; text-align:left; width:22%; }
  .compare-table td { width:39%; }
  .better { font-weight:700; color:#1a7f37; }
  .name-head { font-size:1.1rem; font-weight:700; }
</style>
</head>
<body>
<header class="site-header">
  <h1>일하는 국회</h1>
  <p class="subtitle">의원 간 비교</p>
</header>
<main>
  <a class="back" href="/" style="display:inline-block;margin-bottom:12px;color:#2f81f7;text-decoration:none;">&larr; 전체 실적표로</a>

  <div class="picker-row">
    <div class="picker-box">
      <div class="suggest">
        <input type="search" id="pick-a" placeholder="첫 번째 의원 이름 검색">
        <div class="suggest-list" id="suggest-a"></div>
      </div>
    </div>
    <div class="picker-box">
      <div class="suggest">
        <input type="search" id="pick-b" placeholder="두 번째 의원 이름 검색">
        <div class="suggest-list" id="suggest-b"></div>
      </div>
    </div>
  </div>

  <div id="result">두 명을 선택하면 비교 결과가 표시됩니다.</div>

  <section class="method-note" style="margin-top:24px;">
    <p>등급·백분위는 설계자가 정한 비중(입법 40%·표결 35%·본회의 출석 25%)에 따른 상대적 지표이며, 완전히 객관적인 능력 평가가 아닙니다. 위원회 출석은 1단계 산식에서 제외됩니다. 자세한 내용은 <a href="https://github.com/hansaempark87/assembly/blob/main/docs/evaluation-draft.md" target="_blank" rel="noopener">평가 설계 문서</a>를 참고하세요.</p>
  </section>
</main>
<footer>
  <p>데이터 출처: <a href="https://open.assembly.go.kr" target="_blank" rel="noopener">열린국회정보</a>, <a href="https://record.assembly.go.kr" target="_blank" rel="noopener">국회회의록</a>. 소스: <a href="https://github.com/hansaempark87/assembly" target="_blank" rel="noopener">GitHub</a></p>
</footer>
<script src="/js/compare.js"></script>
</body>
</html>
