<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>의원 비교 — 일하는 국회</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><span class="brand-mark">국</span><span class="brand-text">일하는 국회</span></a>
    <nav class="nav">
      <a href="/">대시보드</a>
      <a href="/compare.html" aria-current="page">의원 비교</a>
      <a href="/#method">평가 방법</a>
    </nav>
    <span class="topbar-spacer"></span>
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="테마 전환">☾</button>
  </div>
</header>

<main>
  <div class="page-head">
    <div>
      <h1>의원 비교</h1>
      <p>같은 기간·같은 기준으로 두 의원의 실적을 나란히 봅니다</p>
    </div>
  </div>

  <section class="card">
    <div class="vs">
      <div class="combo">
        <span class="combo-icon" aria-hidden="true">⌕</span>
        <input class="input" id="pick-a" type="search" placeholder="첫 번째 의원" autocomplete="off" aria-label="첫 번째 의원 검색">
        <div class="combo-list" id="list-a"></div>
      </div>
      <button class="icon-btn vs-swap" id="swap" type="button" aria-label="두 의원 위치 바꾸기">⇄</button>
      <div class="combo">
        <span class="combo-icon" aria-hidden="true">⌕</span>
        <input class="input" id="pick-b" type="search" placeholder="두 번째 의원" autocomplete="off" aria-label="두 번째 의원 검색">
        <div class="combo-list" id="list-b"></div>
      </div>
    </div>
  </section>

  <div id="result" class="section"></div>
</main>

<footer class="site">
  데이터 출처: <a href="https://open.assembly.go.kr" target="_blank" rel="noopener">열린국회정보</a> · <a href="https://record.assembly.go.kr" target="_blank" rel="noopener">국회회의록</a> · 소스 <a href="https://github.com/hansaempark87/assembly" target="_blank" rel="noopener">GitHub</a>
</footer>

<script src="/js/common.js"></script>
<script src="/js/compare.js"></script>
</body>
</html>
